  p { margin: 0 0 12px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0; }
  .intro { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; margin-top: 16px; }
  nav a { color: var(--tint); text-decoration: none; }
  nav a[aria-current] { color: var(--muted); font-weight: 600; }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; margin-top: 48px; padding-top: 16px; }
</style>
